# PostgreSQL local pour le developpement : docker compose up -d db
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mamy_khaliqa
      POSTGRES_USER: mamy
      POSTGRES_PASSWORD: mamy
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
