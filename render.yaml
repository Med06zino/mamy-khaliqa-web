# Blueprint Render (a adapter). Les valeurs "sync: false" sont a saisir dans le tableau de bord Render.
services:
  - type: web
    name: mamy-khaliqa-api
    runtime: python
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3
    disk:
      name: media
      mountPath: /var/data/media
      sizeGB: 5
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mamy-khaliqa-db
          property: connectionString
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: EMAIL_BACKEND
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
databases:
  - name: mamy-khaliqa-db
    plan: basic-256mb
